[project]
name = "ops-orchestrator"
version = "0.1.0"
description = "Persistent project and task control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi", "uvicorn[standard]", "sqlalchemy", "psycopg[binary]",
  "pydantic-settings", "structlog",
  "redis", "rq", "httpx", "python-multipart",
]

[project.scripts]
opsctl = "app.cli:cli"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
