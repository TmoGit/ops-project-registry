<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Ops login</title><style>body{font:16px system-ui;background:#10151d;color:#e8edf5;display:grid;place-items:center;height:100vh;margin:0}main{background:#18212d;border:1px solid #2b3949;border-radius:10px;padding:28px;width:min(360px,90vw)}input,button{box-sizing:border-box;width:100%;padding:10px;margin:8px 0;border-radius:6px}input{background:#10151d;border:1px solid #42536a;color:white}button{background:#80d99e;border:0;font-weight:bold}.error{color:#ffaaa5}</style></head><body><main><h1>Ops Orchestrator</h1><p>Local admin sign-in</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><label>Password<input name="password" type="password" autocomplete="current-password" autofocus required></label><button>Sign in</button></form></main></body></html>
