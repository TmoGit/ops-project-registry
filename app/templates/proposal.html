<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Complete proposed record</title><style>body{font:16px system-ui;margin:2rem;max-width:760px;background:#101418;color:#e8edf2}label{display:block;margin-top:1rem}input,textarea{box-sizing:border-box;width:100%;padding:.55rem}textarea{min-height:10rem}button{margin-top:1rem;padding:.65rem 1rem}</style></head>
<body><h1>Complete proposed record</h1><p>Intake {{ intake.id }}: {{ intake.raw_request }}</p><form method="post"><label>Project key<input name="project_key" required value="{{ record.get('project_key', '') }}"></label><label>Project name<input name="project_name" required value="{{ record.get('project_name', '') }}"></label><label>Task title<input name="task_title" required value="{{ record.get('task_title', '') }}"></label><label>Task description<textarea name="task_description" required>{{ record.get('task_description', '') }}</textarea></label><label>Test command (optional)<input name="test_command" value="{{ record.get('test_command', '') }}" placeholder="python -m pytest -q"></label><button type="submit">Save and notify mobile</button></form></body></html>
